<style>
/* Layout: แอปมือถือคอลัมน์เดียว (กว้างสุด 440px) · แถบบนบอกว่าเป็นตัวอย่าง · เมนูล่างติดขอบจอ — สีตามธีมบริษัท (Forest / Moss / Desert / Linen) */
:root{
  --bg:#f2f0eb; --panel:#fdfcf9; --ink:#24302a; --ink2:#5c645e; --ink3:#8b8f8a; --line:#E2E0D8; --line2:#ecebe5;
  --forest:#35654E; --forest2:#e2ebe5; --moss:#789474; --desert:#A9947A; --linen:#E2E0D8; --on-forest:#ffffff;
  --danger:#a8432e; --danger2:#f6e6df; --warn:#80612b; --warn2:#f3ead8; --info:#4a6886; --info2:#e4eaf1;
  --scrim:rgba(36,48,42,.45); --toast:#24302a; --toast-ink:#fdfcf9;
  --font:"Noto Sans Thai","Leelawadee UI",Tahoma,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#151c18; --panel:#1d2621; --ink:#e6ebe7; --ink2:#a9b3ac; --ink3:#7d877f; --line:#2f3a33; --line2:#26302a;
  --forest:#6fa88b; --forest2:#21362b; --moss:#93ad8f; --desert:#c2ad92; --linen:#2f3a33; --on-forest:#0f1712;
  --danger:#e08a73; --danger2:#3a2620; --warn:#d6b06a; --warn2:#352c1a; --info:#8fb0d1; --info2:#1f2a36;
  --scrim:rgba(0,0,0,.55); --toast:#e6ebe7; --toast-ink:#151c18; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#151c18; --panel:#1d2621; --ink:#e6ebe7; --ink2:#a9b3ac; --ink3:#7d877f; --line:#2f3a33; --line2:#26302a;
  --forest:#6fa88b; --forest2:#21362b; --moss:#93ad8f; --desert:#c2ad92; --linen:#2f3a33; --on-forest:#0f1712;
  --danger:#e08a73; --danger2:#3a2620; --warn:#d6b06a; --warn2:#352c1a; --info:#8fb0d1; --info2:#1f2a36;
  --scrim:rgba(0,0,0,.55); --toast:#e6ebe7; --toast-ink:#151c18; color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font:15px/1.5 var(--font);margin:0}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:1px solid var(--line);background:var(--panel);border-radius:10px;padding:10px 12px;min-height:44px}
button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:2px solid var(--forest);outline-offset:2px}
input,textarea,select{width:100%;border:1px solid var(--line);background:var(--panel);border-radius:10px;padding:10px 12px}
.app{max-width:440px;margin:0 auto;min-height:100%;display:flex;flex-direction:column;background:var(--bg);position:relative}
.demo{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:12.5px;background:var(--warn2);color:var(--warn);
  padding:8px max(16px,env(safe-area-inset-right,0px)) 8px max(16px,env(safe-area-inset-left,0px))}
.demo select{width:auto;padding:4px 8px;min-height:32px;font-size:12.5px;background:var(--panel)}
.demo label{display:flex;gap:6px;align-items:center}
.demo input{width:auto}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--panel);border-bottom:3px solid var(--forest);
  padding:10px max(16px,env(safe-area-inset-right,0px)) 10px max(16px,env(safe-area-inset-left,0px));display:flex;align-items:center;gap:10px}
.logo{background:var(--forest);color:var(--on-forest);border-radius:7px;padding:1px 8px;font-weight:600;font-size:13px;letter-spacing:.4px}
.top .t{font-weight:600}
.top .q{margin-left:auto;font-size:12px;color:var(--warn)}
main{flex:1;display:flex;flex-direction:column;gap:10px;padding:14px max(16px,env(safe-area-inset-right,0px)) 18px max(16px,env(safe-area-inset-left,0px))}
.hello .d{font-size:13px;color:var(--ink2)} .hello .n{font-size:21px;font-weight:600;text-wrap:balance}
.hello .s{font-size:13px;color:var(--ink2)}
.sec{font-size:13px;color:var(--ink3);margin-top:6px;letter-spacing:.2px}
.cd{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px 14px;cursor:pointer;display:flex;flex-direction:column;gap:2px}
.cd.od{border-left:5px solid var(--danger);border-radius:4px 14px 14px 4px}
.cd.dn{color:var(--ink3)}
.cd .tt{font-weight:600}
.cd .mt{font-size:13px;color:var(--ink2)}
.late{font-size:12px;color:var(--danger);font-weight:500}
.pill{font-size:12px;padding:2px 8px;border-radius:999px;align-self:flex-start}
.p-wait{background:var(--warn2);color:var(--warn)} .p-doing{background:var(--info2);color:var(--info)} .p-done{background:var(--forest2);color:var(--forest)}
.bt{display:flex;gap:8px;margin-top:8px}
.bt button{flex:1;font-size:14px}
.ok{background:var(--forest);color:var(--on-forest);border-color:var(--forest);font-weight:500}
nav{position:sticky;bottom:0;z-index:5;display:flex;background:var(--panel);border-top:1px solid var(--line);
  padding:0 max(0px,env(safe-area-inset-right,0px)) env(safe-area-inset-bottom,0px) max(0px,env(safe-area-inset-left,0px))}
nav button{flex:1;border:0;border-radius:0;background:transparent;display:flex;flex-direction:column;align-items:center;gap:1px;font-size:12px;color:var(--ink2);padding:8px 0 9px}
nav button .i{font-size:21px;line-height:1.1}
nav button.on{color:var(--forest);font-weight:600;box-shadow:inset 0 3px 0 var(--forest)}
.box{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px 14px;display:flex;flex-direction:column;gap:6px}
.lbl{font-size:12.5px;color:var(--ink3)}
.steps{display:flex;flex-direction:column;gap:6px}
.st{display:flex;gap:10px;align-items:center;font-size:14px;color:var(--ink2)}
.st .dt{width:14px;height:14px;border-radius:50%;border:2px solid var(--line);flex:none}
.st.done .dt{background:var(--forest);border-color:var(--forest)} .st.cur{color:var(--ink);font-weight:600} .st.cur .dt{border-color:var(--forest)}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px;text-align:center}
.cal .h{font-size:12px;color:var(--ink3)}
.cal button{min-height:44px;padding:4px 0;border-radius:10px;font-size:14px;font-variant-numeric:tabular-nums;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px}
.cal button.td{background:var(--forest2);color:var(--forest);font-weight:600}
.cal button.sel{outline:2px solid var(--forest);outline-offset:-2px}
.dot{width:6px;height:6px;border-radius:50%;display:block}
.d-job{background:var(--info)} .d-off{background:var(--desert)}
.legend{display:flex;gap:14px;font-size:12px;color:var(--ink2)} .legend span{display:flex;gap:5px;align-items:center}
.off{background:var(--warn2);color:var(--warn);border-color:transparent;cursor:default}
.who{display:flex;justify-content:space-between;align-items:center;text-align:left}
.who .r{font-size:13px}
.sheet{position:fixed;inset:0;background:var(--scrim);display:flex;align-items:flex-end;justify-content:center;z-index:10}
.sheet .in{background:var(--panel);width:100%;max-width:440px;border-radius:18px 18px 0 0;display:flex;flex-direction:column;gap:8px;
  padding:16px max(16px,env(safe-area-inset-right,0px)) calc(16px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.sheet .h{font-weight:600}
.err{font-size:13px;color:var(--danger);min-height:1em}
.toast{position:fixed;left:50%;transform:translateX(-50%);width:min(408px,calc(100% - 32px));bottom:calc(76px + env(safe-area-inset-bottom,0px));z-index:20;background:var(--toast);color:var(--toast-ink);border-radius:12px;padding:10px 14px;font-size:13.5px;text-align:center}
.empty{text-align:center;color:var(--ink2);cursor:default}
.back{align-self:flex-start;min-height:36px;padding:6px 12px;font-size:13px}
@media (prefers-reduced-motion:no-preference){.sheet .in{animation:up .18s ease-out}@keyframes up{from{transform:translateY(24px);opacity:.6}to{transform:none;opacity:1}}}
</style>

.cal button{border-radius:12px}
.pill{border-radius:999px}

nav{bottom:calc(env(safe-area-inset-bottom,0px) + 10px);margin:0 10px 10px;padding:5px;gap:2px;border-radius:24px;border:1px solid var(--edge);
  background:var(--glass);-webkit-backdrop-filter:blur(18px) saturate(170%);backdrop-filter:blur(18px) saturate(170%);box-shadow:var(--sh),inset 0 1px 0 var(--edge)}

.sheet{background:rgba(15,30,22,.25)}

@supports not ((backdrop-filter:blur(1px)) or (-webkit-backdrop-filter:blur(1px))){.top,nav,.sheet .in{background:var(--panel)}}

  var od = a.filter(function(t){ return t.d < TODAY; }), td = a.filter(function(t){ return t.d >= TODAY && t.s <= TODAY; }), nx = a.filter(function(t){ return t.s > TODAY; }), dn = mine.filter(function(t){ return t.st === "done"; });
  var g = function(ttl, xs){ return xs.length ? '<div class="sec">' + ttl + "</div>" + xs.map(card).join("") : ""; };
  return '<div class="hello"><div class="d">' + DOWL[new Date(TODAY).getDay()] + " " + dd(TODAY) + ' 69</div><div class="n">สวัสดี ' + esc(me()) + '</div><div class="s">ค้าง ' + a.length + " งาน" +
    (od.length ? ' · <span style="color:var(--danger)">เลยกำหนด ' + od.length + "</span>" : "") + "</div></div>" +
    g("เลยกำหนด", od) + g("ต้องทำวันนี้", td) + g("ถัดไป", nx) + (!a.length ? '<div class="cd empty">ไม่มีงานค้าง 👍</div>' : "") + g("เสร็จแล้ว", dn.slice(0, 2));
}
function vDetail(t){
  var od = t.st !== "done" && t.d < TODAY;
  return '<button class="back" data-a="back">← กลับ</button>' +
    '<div><div class="lbl">' + esc(t.no) + '</div><div style="font-size:20px;font-weight:600">' + esc(t.p) + "</div><div>" + esc(t.t) + "</div></div>" +
    '<div class="box"><span class="lbl">อาการ / สิ่งที่ต้องทำ</span>' + esc(t.prob) + "</div>" +
    '<div class="box"><div>📅 ' + dd(t.s) + " → " + dd(t.d) + (od ? ' <span class="late">(เลย ' + diff(t.d, TODAY) + " วัน)</span>" : "") + "</div><div>👤 " + esc(t.ct) + "</div>" +
    '<div class="bt" style="margin-top:4px"><button data-a="nav">📍 นำทาง</button><button data-a="call">📞 โทร</button></div></div>' +
    '<div class="sec">ขั้นตอนของเคส</div><div class="box steps">' + t.steps.map(function(s, i){
      return '<div class="st' + (i < t.cur ? " done" : i === t.cur ? " cur" : "") + '"><span class="dt"></span>' + esc(s) + (i === t.cur && t.st !== "done" ? " · ขั้นนี้" : "") + "</div>"; }).join("") + "</div>" +
    (t.st === "done" ? '<span class="pill p-done">✓ เสร็จ ' + (t.doneAt ? ddt(t.doneAt) : "แล้ว") + (t.note ? " · " + esc(t.note) : "") + "</span>"
      : t.w === me() ? btns(t) : '<div class="lbl">งานนี้อยู่กับ ' + esc(t.w || "ทีม Maintenance (รอมอบหมาย)") + "</div>");
}
function vCal(){
  var first = new Date("2026-10-01").getDay(), h = '<div style="font-size:18px;font-weight:600">' + MON + ' 69</div><div class="cal">' + DOW.map(function(x){ return '<span class="h">' + x + "</span>"; }).join("");
  for(var i = 0; i < first; i++) h += "<span></span>";
  for(var d = 1; d <= 31; d++){
    var k = "2026-10-" + (d < 10 ? "0" : "") + d;
    var ts = T.filter(function(t){ return t.w === me() && t.st !== "done" && k >= t.s && k <= t.d; }), bz = BUSY.filter(function(b){ return b.n === me() && k >= b.s && k <= b.e; });
    h += '<button data-c="' + k + '" class="' + (k === TODAY ? "td" : "") + (k === calSel ? " sel" : "") + '" aria-label="' + d + " " + MON + '">' + d + (bz.length ? '<span class="dot d-off"></span>' : ts.length ? '<span class="dot d-job"></span>' : "") + "</button>";
  }
  var ts2 = T.filter(function(t){ return t.w === me() && calSel >= t.s && calSel <= t.d; }), bz2 = BUSY.filter(function(b){ return b.n === me() && calSel >= b.s && calSel <= b.e; });
  return h + '</div><div class="legend"><span><i class="dot d-job"></i>มีงาน</span><span><i class="dot d-off"></i>ลา / ออกหน้างาน</span></div><div class="sec">' + DOWL[new Date(calSel).getDay()] + " " + dd(calSel) + "</div>" +
    bz2.map(function(b){ return '<div class="cd off">🌴 ' + esc(b.k) + "</div>"; }).join("") + ts2.map(card).join("") + (!ts2.length && !bz2.length ? '<div class="lbl">ว่าง</div>' : "") +
    '<button data-a="leave">＋ ลงลา / ออกหน้างาน วันนี้</button>';
}
function vFind(){
  var r = T.filter(function(t){ return !q || (t.p + t.t + t.no).toLowerCase().indexOf(q.toLowerCase()) >= 0; });
  return '<input id="fq" type="search" placeholder="ชื่อโครงการ เช่น SRT1" aria-label="ค้นหาเคส" value="' + esc(q) + '">' +
    r.map(function(t){ return '<div class="cd" data-o="' + t.id + '" role="button" tabindex="0"><span class="lbl">' + esc(t.no) + '</span><span class="tt">' + esc(t.p) + " · " + esc(t.t) + '</span><span class="mt">' + (t.st === "done" ? "✓ เสร็จแล้ว" : "อยู่กับ " + esc(t.w || "ทีม (รอมอบหมาย)")) + "</span></div>"; }).join("") +
    (!r.length ? '<div class="cd empty">ไม่พบเคสที่ตรงกับ “' + esc(q) + '”</div>' : "");
}
function vAsg(){
  var r = T.filter(function(t){ return !t.w && t.st !== "done"; });
  return '<div class="sec">รอมอบหมาย · ทีม Maintenance</div>' + r.map(function(t){ return '<div class="cd" data-g="' + t.id + '" role="button" tabindex="0"><span class="tt">' + esc(t.p) + " · " + esc(t.t) + '</span><span class="mt">' + dd(t.s) + " → " + dd(t.d) + " · แตะเพื่อเลือกคน</span></div>"; }).join("") +
    (!r.length ? '<div class="cd empty">มอบหมายครบแล้ว 👍</div>' : "");
}
function sPick(t){
  return '<div class="h">มอบหมาย ' + esc(t.p) + " · " + esc(t.t) + '</div><div class="lbl">' + dd(t.s) + " → " + dd(t.d) + " · เรียงคนว่างก่อน</div>" +
    PPL.map(function(n){ var bz = BUSY.filter(function(b){ return b.n === n && b.s <= t.d && b.e >= t.s; })[0], cl = T.filter(function(x){ return x.w === n && x.st !== "done" && x.s <= t.d && x.d >= t.s; }).length; return {n: n, bz: bz, cl: cl, sc: (bz ? 2 : 0) + cl}; })
      .sort(function(a, b){ return a.sc - b.sc; }).map(function(x){
        return '<button class="who" data-a="pick" data-n="' + esc(x.n) + '" data-i="' + t.id + '"><span>' + esc(x.n) + '</span><span class="r" style="color:' + (x.bz ? "var(--warn)" : x.cl ? "var(--danger)" : "var(--forest)") + '">' + (x.bz ? esc(x.bz.k) : x.cl ? "งานซ้อน " + x.cl : "ว่าง") + "</span></button>"; }).join("") +
    '<button data-a="close">ยกเลิก</button>';
}
function draw(){
  var t = open && T.filter(function(x){ return x.id === open; })[0];
  var NAV = [["my","☀️","งานของฉัน"],["cal","📅","ปฏิทิน"],["find","🔍","ค้นหาเคส"]].concat(lead() ? [["asg","🙋","มอบหมาย"]] : []);
  $("ttl").textContent = t ? "รายละเอียดเคส" : NAV.filter(function(n){ return n[0] === tab; })[0][2];
  $("bd").innerHTML = t ? vDetail(t) : tab === "my" ? vMy() : tab === "cal" ? vCal() : tab === "find" ? vFind() : vAsg();
  $("nv").innerHTML = NAV.map(function(n){ return '<button data-t="' + n[0] + '" class="' + (tab === n[0] && !open ? "on" : "") + '"><span class="i" aria-hidden="true">' + n[1] + "</span>" + n[2] + "</button>"; }).join("");
  var old = document.querySelector(".sheet"); if(old) old.remove();
  if(sheet){ var s = document.createElement("div"); s.className = "sheet"; s.innerHTML = '<div class="in" role="dialog" aria-modal="true">' + sheet + "</div>"; $("app").appendChild(s); }
  var fq = $("fq"); if(fq) fq.oninput = function(e){ q = e.target.value; var p = fq.selectionStart; draw(); var n = $("fq"); n.focus(); n.setSelectionRange(p, p); };
}
$("app").addEventListener("click", function(e){
  var b = e.target.closest("[data-a],[data-t],[data-o],[data-g],[data-c]"); if(!b) return;
  if(e.target.closest(".sheet") && !e.target.closest(".in")){ sheet = null; return draw(); }
  if(b.dataset.t){ tab = b.dataset.t; open = null; sheet = null; window.scrollTo(0, 0); return draw(); }
  if(b.dataset.c){ calSel = b.dataset.c; return draw(); }
  if(b.dataset.g){ sheet = sPick(T.filter(function(x){ return x.id == b.dataset.g; })[0]); return draw(); }
  var a = b.dataset.a, t = b.dataset.i && T.filter(function(x){ return x.id == b.dataset.i; })[0];
  if(!a && b.dataset.o){ open = +b.dataset.o; window.scrollTo(0, 0); return draw(); }
  if(a === "back"){ open = null; return draw(); }
  if(a === "close"){ sheet = null; return draw(); }
  if(a === "nav") return toast("ของจริง: เปิด Google Maps ไปที่ไซต์");
  if(a === "call") return toast("ของจริง: โทรหา " + T.filter(function(x){ return x.id === open; })[0].ct);
  if(a === "start") return act(t, "doing", "เริ่มงาน " + t.p + " แล้ว");
  if(a === "wait"){ sheet = '<div class="h">พักงานไว้ — รออะไร?</div>' + ["รออะไหล่","รอลูกค้าตอบ","รอผู้รับเหมา","รอสภาพอากาศ"].map(function(r){ return '<button data-a="wr" data-i="' + t.id + '" data-r="' + r + '">' + r + "</button>"; }).join("") + '<button data-a="close">ยกเลิก</button>'; return draw(); }
  if(a === "wr"){ t.wr = b.dataset.r; return act(t, "wait", "พักงานไว้ · " + t.wr); }
  if(a === "done"){
    sheet = '<div class="h">เสร็จงาน ' + esc(t.p) + " · " + esc(t.t) + '</div><label class="lbl" for="nt">ทำอะไรไปบ้าง</label><textarea id="nt" rows="3" placeholder="เช่น เปลี่ยน INV3 แล้ว ระบบกลับมาปกติ"></textarea><div class="err" id="er" aria-live="polite"></div>' +
      '<div style="display:flex;gap:8px"><div style="flex:1;display:flex;flex-direction:column;gap:4px"><label class="lbl" for="dn">วันที่เสร็จ</label><input id="dn" type="date" value="' + TODAY + '" max="' + TODAY + '"></div>' +
      '<div style="flex:1;display:flex;flex-direction:column;gap:4px"><label class="lbl" for="tm">เวลาที่เสร็จ</label><input id="tm" type="time" value="' + (function(){ var n = new Date(); return pad(n.getHours()) + ":" + pad(n.getMinutes()); })() + '"></div></div>' +
      '<div class="err" id="er2" aria-live="polite"></div><button data-a="photo">📷 แนบรูป (ไม่บังคับ)</button><button class="ok" data-a="fin" data-i="' + t.id + '">✓ บันทึกว่าเสร็จ</button><button data-a="close">ยกเลิก</button>';
    draw(); $("nt").oninput = function(){ $("er").textContent = ""; }; ["dn", "tm"].forEach(function(id){ $(id).oninput = function(){ $("er2").textContent = ""; }; }); $("nt").focus(); return;
  }
  if(a === "photo") return toast("ของจริง: เปิดกล้อง แล้วย่อรูปก่อนส่ง");
  if(a === "fin"){ var v = $("nt").value.trim(), dn = $("dn").value, tm = $("tm").value;
    if(!v){ $("er").textContent = "เขียนสั้น ๆ ว่าทำอะไรไปก่อน"; $("nt").focus(); return; }
    if(!dn || !tm){ $("er2").textContent = "ใส่วันที่และเวลาที่เสร็จ"; (dn ? $("tm") : $("dn")).focus(); return; }
    if(dn > TODAY){ $("er2").textContent = "วันที่เสร็จต้องไม่เกินวันนี้"; $("dn").focus(); return; }
    t.note = v; t.doneAt = dn + " " + tm; t.cur = t.steps.length; return act(t, "done", "บันทึกว่าเสร็จ " + ddt(t.doneAt) + " · ส่งต่อขั้นถัดไป"); }
  if(a === "leave"){ sheet = '<div class="h">ลงตาราง ' + dd(calSel) + "</div>" + ["ลาพักร้อน","ลาป่วย","ลากิจ","ออกหน้างาน"].map(function(k){ return '<button data-a="lv" data-k="' + k + '">' + k + "</button>"; }).join("") + '<button data-a="close">ยกเลิก</button>'; return draw(); }
  if(a === "lv"){ BUSY.push({n: me(), s: calSel, e: calSel, k: b.dataset.k}); sheet = null; toast("ลง" + b.dataset.k + " " + dd(calSel) + " แล้ว"); return draw(); }
  if(a === "pick"){ t.w = b.dataset.n; sheet = null; toast("มอบหมาย " + t.p + " ให้ " + t.w + " แล้ว"); return draw(); }
});
$("app").addEventListener("keydown", function(e){ if((e.key === "Enter" || e.key === " ") && e.target.matches("[role=button]")){ e.preventDefault(); e.target.click(); } });
/* 🌙 สลับโหมดสี — ยังไม่เลือก = ตามเครื่อง */
function isDark(){ var a = document.documentElement.getAttribute("data-theme"); return a ? a === "dark" : !!(window.matchMedia && matchMedia("(prefers-color-scheme: dark)").matches); }
function thIcon(){ $("thb").textContent = isDark() ? "☀️" : "🌙"; }
$("thb").onclick = function(){ var t = isDark() ? "light" : "dark"; document.documentElement.setAttribute("data-theme", t); try { localStorage.setItem("aom_m_theme", t); } catch(e){} thIcon(); };
thIcon();
$("who").onchange = function(){ open = null; sheet = null; if(!lead() && tab === "asg") tab = "my"; draw(); };
draw();
</script>
